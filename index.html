<main id="main">
  <!-- ============ ПЕРВЫЙ ЭКРАН ============ -->
  <section class="hero" id="hero">
    <div class="hero__scene" aria-hidden="true">
      <div class="hero__drift">
        <picture class="hero__media">
          <source media="(max-width: 767px), (max-width: 1100px) and (orientation: portrait)" type="image/avif" srcset="img/hero-beam-m-700.avif 700w, img/hero-beam-m-1300.avif 1300w" sizes="100vw">
          <source media="(max-width: 767px), (max-width: 1100px) and (orientation: portrait)" srcset="img/hero-beam-m-700.jpg 700w, img/hero-beam-m-1300.jpg 1300w" sizes="100vw">
          <source type="image/avif" srcset="img/hero-beam-1600.avif 1600w, img/hero-beam-2688.avif 2688w" sizes="100vw">
          <img src="img/hero-beam-1600.jpg" srcset="img/hero-beam-1600.jpg 1600w, img/hero-beam-2688.jpg 2688w" sizes="100vw" alt="" width="1600" height="904" fetchpriority="high" decoding="async">
        </picture>
      </div>
      <span class="hero__sweep"></span>
      <span class="hero__glow"></span>
      <span class="hero__veil"></span>
    </div>
    <div class="wrap hero__inner">
      <div class="hero__text">
        <h1 class="hero__title" data-i18n-lines="hero_title"></h1>
        <p class="hero__lead" data-i18n="hero_lead"></p>
        <div class="hero__cta">
          <a class="btn btn--primary hero__btn" href="#request" data-i18n="hero_cta1"></a>
          <a class="btn btn--ghost hero__btn2" href="catalog.html"><span data-i18n="hero_cta2"></span><span class="hero__arr" aria-hidden="true">→</span></a>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ КАТАЛОГ ПО КАТЕГОРИЯМ ============ -->
  <section class="section" id="catalog">
    <div class="wrap">
      <div class="section__head">
        <div><h2 data-i18n="catalog_h"></h2></div>
      </div>
      <ul class="catgrid" id="cats"></ul>
    </div>
  </section>

  <!-- ============ ТОП ПОЗИЦИИ ============ -->
  <section class="section section--grey" id="top">
    <div class="wrap">
      <div class="section__head">
        <div><h2 data-i18n="top_h"></h2><p class="section__sub section__sub--tight" data-i18n="top_sub"></p></div>
      </div>
      <div class="table-wrap">
        <table class="table table--top">
          <thead><tr><th scope="col" data-i18n="th_name"></th><th scope="col" data-i18n="th_spec"></th><th scope="col" data-i18n="th_steel"></th><th scope="col" data-i18n="th_len"></th><th scope="col" class="num" data-i18n="th_unit"></th><th scope="col" class="num" data-i18n="th_price"></th><th><span class="sr" data-i18n="request_btn"></span></th></tr></thead>
          <tbody id="topRows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ============ ПРЕИМУЩЕСТВА ============ -->

  <!-- ============ О КОМПАНИИ ============ -->

  <!-- ============ КАЛЬКУЛЯТОР ============ -->
  <section class="section" id="calc">
    <div class="wrap calc">
      <div>
        <h2 data-i18n="calc_h"></h2>
        <p class="section__sub" data-i18n="calc_sub"></p>
      </div>
      <form class="card calc__form" id="calcForm">
        <label><span data-i18n="calc_type"></span>
          <select class="input" id="cType">
            <option value="rebar" data-i18n="ct_rebar"></option>
            <option value="sheet" data-i18n="ct_sheet"></option>
            <option value="pipe" data-i18n="ct_pipe"></option>
            <option value="square" data-i18n="ct_square"></option>
          </select>
        </label>
        <div class="calc__fields" id="cFields"></div>
        <div class="calc__two">
          <label><span data-i18n="calc_qty"></span><input class="input" id="cQty" type="number" min="1" inputmode="decimal" value="1"></label>
          <label><span data-i18n="calc_price"></span><input class="input" id="cPrice" type="number" min="0" inputmode="numeric" value=""><small class="calc__src" id="cPriceSrc"></small></label>
        </div>
        <div class="calc__result" aria-live="polite">
          <div><span data-i18n="calc_mass"></span><b id="cWeight">—</b></div>
          <div><span data-i18n="calc_sum"></span><b id="cSum">—</b></div>
        </div>
        <button class="btn btn--outline btn--block" type="button" id="calcToReq" data-i18n="calc_to_req"></button>
        <p class="hint" data-i18n="calc_hint"></p>
      </form>
    </div>
  </section>

  <!-- ============ ОПЛАТА И САМОВЫВОЗ ============ -->
  <section class="section section--grey" id="pay">
    <div class="wrap split">
      <div>
        <h2 data-i18n="pay_h"></h2>
        <ul class="list">
          <li><b data-i18n="dl1_b"></b><span data-i18n="dl1"></span></li>
          <li><b data-i18n="dl2_b"></b><span data-i18n="dl2"></span></li>
          <li><b data-i18n="dl3_b"></b><span data-i18n="dl3"></span></li>
          <li><b data-i18n="dl4_b"></b><span data-i18n="dl4"></span></li>
          <li><b data-i18n="dl5_b"></b><span data-i18n="dl5"></span></li>
        </ul>
      </div>
      <div class="card">
        <h3 class="h3" data-i18n="how_h"></h3>
        <ol class="steps">
          <li data-i18n="hw1"></li><li data-i18n="hw2"></li><li data-i18n="hw3"></li><li data-i18n="hw4"></li>
        </ol>
      </div>
    </div>
  </section>

  <!-- ============ FAQ ============ -->

  <!-- ============ ЗАЯВКА + КОНТАКТЫ ============ -->
  <section class="section" id="request">
    <div class="wrap request">
      <form class="card form" id="form" novalidate>
        <h2 data-i18n="req_h"></h2>
        <p class="section__sub" data-i18n="req_sub"></p>
        <div class="form__ok" id="formOk" role="status" tabindex="-1" hidden></div>
        <div class="picked" id="picked" hidden>
          <h3 class="h3" data-i18n="picked_h"></h3>
          <ul id="pickedList"></ul>
          <button class="link" id="pickedClear" type="button" data-i18n="clear"></button>
        </div>
        <div class="field">
          <label for="fName" data-i18n="f_name"></label>
          <input class="input" id="fName" name="name" autocomplete="name" aria-describedby="nameErr">
          <p class="err" id="nameErr" hidden></p>
        </div>
        <div class="field">
          <label for="fPhone" data-i18n="f_phone"></label>
          <input class="input" id="fPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" data-i18n-ph="phone_ph" aria-describedby="phoneErr">
          <p class="err" id="phoneErr" hidden></p>
        </div>
        <div class="field">
          <label for="fComment" data-i18n="f_comment"></label>
          <textarea class="input" id="fComment" name="comment" rows="3" data-i18n-ph="comment_ph"></textarea>
        </div>
        <button class="btn btn--primary btn--block btn--arrow" type="submit"><span data-i18n="send"></span><span aria-hidden="true">→</span></button>
        <p class="hint" data-i18n="consent"></p>
      </form>
      <div class="contacts">
        <div class="contacts__item"><div><span class="contacts__l" data-i18n="c_phone"></span><a href="tel:+998712000000">+998 71 200-00-00</a></div></div>
        <div class="contacts__item"><div><span class="contacts__l" data-i18n="c_email"></span><a href="mailto:sales@example.uz">sales@example.uz</a></div></div>
        <div class="contacts__item"><div><span class="contacts__l" data-i18n="c_addr"></span><span data-i18n="foot_addr"></span></div></div>
        <div class="contacts__item"><div><span class="contacts__l" data-i18n="c_hours"></span><span data-i18n="foot_hours"></span></div></div>
        <div class="contacts__social">
          <span class="contacts__l" data-i18n="social_h"></span>
          <div class="contacts__msgs">
            <a class="msg" href="https://t.me/tmsclub" target="_blank" rel="noopener">Telegram</a>
            <a class="msg" href="https://wa.me/998712000000" target="_blank" rel="noopener">WhatsApp</a>
          </div>
        </div>
      </div>
    </div>
  </section>
